<!doctype html><meta charset="utf-8"><title>palfeed bench</title><pre id="out">running</pre>
<script src="/palfeed.js"></script>
<script>
// headless browser bench: DecompressionStream + decode + putImageData per message, from the recorded wire stream
(async function () {
  var wire = new Uint8Array(await (await fetch('/stream.pf')).arrayBuffer());
  var msgs = new PalFeed.Splitter().push(wire), dec = new PalFeed.Decoder(), c = document.createElement('canvas');
  c.width = 800; c.height = 600; var ctx = c.getContext('2d', { alpha: false }), img = null, t = [], infl = [], put = [];
  for (var i = 0; i < msgs.length; i++) {
    var h = PalFeed.parseHeader(msgs[i]), t0 = performance.now();
    var ds = new DecompressionStream('deflate-raw');
    var raw = new Uint8Array(await new Response(new Blob([msgs[i].subarray(PalFeed.HEADER)]).stream().pipeThrough(ds)).arrayBuffer());
    var t1 = performance.now(), d = dec.apply(h, raw);
    if (!img || img.data.buffer !== dec.pix.buffer) img = new ImageData(dec.pix, dec.w, dec.h);
    var t2 = performance.now();
    if (d) ctx.putImageData(img, 0, 0, d.x, d.y, d.w, d.h);
    var t3 = performance.now();
    if (!h.key) { t.push(t3 - t0); infl.push(t1 - t0); put.push(t3 - t2); }
  }
  function pc(a, p) { var s = a.slice().sort(function (x, y) { return x - y; }); return s[Math.min(s.length - 1, Math.max(0, Math.ceil(s.length * p / 100) - 1))].toFixed(3); }
  var res = 'BENCH ' + navigator.userAgent + '\ndeltas ' + t.length +
    '\ntotal ms p50 ' + pc(t, 50) + ' p95 ' + pc(t, 95) + '\ninflate (DecompressionStream) ms p50 ' + pc(infl, 50) + ' p95 ' + pc(infl, 95) +
    '\nputImageData ms p50 ' + pc(put, 50) + ' p95 ' + pc(put, 95) + '\nDONE';
  document.getElementById('out').textContent = res;
  await fetch('/result', { method: 'POST', body: res });
})().catch(function (e) { fetch('/result', { method: 'POST', body: 'ERROR ' + e }); });
</script>
