<!doctype html><meta charset="utf-8"><title>palfeed upload bench</title><pre id="out">running</pre>
<script>
// putImageData (2D canvas) against a WebGL texture upload (texSubImage2D + a draw + finish) for a dirty rectangle of an
// 800x600 RGBA frame. Synthetic pixels: this isolates the upload; the decode is measured by bench.html.
(function () {
  var W = 800, H = 600, buf = new Uint8ClampedArray(W * H * 4);
  for (var i = 0; i < buf.length; i++) buf[i] = (i * 2654435761) >>> 24;
  var img = new ImageData(buf, W, H);
  var c2 = document.createElement('canvas'); c2.width = W; c2.height = H; document.body.appendChild(c2);
  var x2 = c2.getContext('2d', { alpha: false });
  var c3 = document.createElement('canvas'); c3.width = W; c3.height = H; document.body.appendChild(c3);
  var gl = c3.getContext('webgl', { alpha: false, antialias: false, preserveDrawingBuffer: false });
  function sh(t, s) { var o = gl.createShader(t); gl.shaderSource(o, s); gl.compileShader(o); return o; }
  var out = ['BENCH2 ' + navigator.userAgent], glok = !!gl;
  if (gl) {
    var pr = gl.createProgram();
    gl.attachShader(pr, sh(gl.VERTEX_SHADER, 'attribute vec2 p;varying vec2 t;void main(){t=p*.5+.5;t.y=1.-t.y;gl_Position=vec4(p,0,1);}'));
    gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, 'precision mediump float;varying vec2 t;uniform sampler2D s;void main(){gl_FragColor=texture2D(s,t);}'));
    gl.linkProgram(pr); gl.useProgram(pr);
    var b = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, b);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
    var l = gl.getAttribLocation(pr, 'p'); gl.enableVertexAttribArray(l); gl.vertexAttribPointer(l, 2, gl.FLOAT, false, 0, 0);
    var tx = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, tx);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, W, H, 0, gl.RGBA, gl.UNSIGNED_BYTE, new Uint8Array(W * H * 4));
  }
  function pc(a, p) { var s = a.slice().sort(function (x, y) { return x - y; }); return s[Math.min(s.length - 1, Math.max(0, Math.ceil(s.length * p / 100) - 1))].toFixed(3); }
  var rects = [[0, 0, 800, 600], [100, 100, 200, 150], [300, 200, 16, 16]];
  function run(name, f) {
    var t = [];
    for (var i = 0; i < 100; i++) { var t0 = performance.now(); f(); t.push(performance.now() - t0); }
    out.push(name + ' ms p50 ' + pc(t, 50) + ' p95 ' + pc(t, 95));
  }
  rects.forEach(function (r) {
    run('2d putImageData ' + r[2] + 'x' + r[3], function () { x2.putImageData(img, 0, 0, r[0], r[1], r[2], r[3]); });
    if (glok) {
      var sub = new Uint8Array(r[2] * r[3] * 4);
      run('webgl texSubImage2D+draw+finish ' + r[2] + 'x' + r[3], function () {
        gl.texSubImage2D(gl.TEXTURE_2D, 0, r[0], r[1], r[2], r[3], gl.RGBA, gl.UNSIGNED_BYTE, sub);
        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4); gl.finish();
      });
    }
  });
  if (!glok) out.push('webgl unavailable in this browser');
  out.push('DONE');
  var res = out.join('\n'); document.getElementById('out').textContent = res;
  fetch('/result', { method: 'POST', body: res });
})();
</script>
