# Add inside the existing `server { ... }` of the updates site's nginx.conf (the static feed stays GET/HEAD only).
# The receiver container sits on the same user network as nginx and is NOT reachable from outside except through this path.
location = /support/upload {
    limit_except POST { deny all; }
    client_max_body_size 21m;
    client_body_timeout 60s;
    proxy_request_buffering on;
    proxy_pass http://didle-support-recv:8899;   # the client Authorization header passes through unchanged
    proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;   # the tunnel sets it; the receiver only trusts it with -trust-proxy
    proxy_set_header X-Forwarded-For "";
    access_log off;                                              # no addresses of friends in nginx logs for this path
}
location = /support/health {
    proxy_pass http://didle-support-recv:8899;
    access_log off;
}
# Nothing under /support/ is ever served statically; the inbox is not under www/.
