# Two parts. Reach the location ONLY through the tunnel (the receiver trusts the CF-Connecting-IP header the tunnel sets;
# a path that skips the tunnel lets a client forge it). The static feed stays GET/HEAD only.

# 1) in the http { } block of nginx.conf:
map $http_cf_connecting_ip $support_key {
    default $http_cf_connecting_ip;
    ""      "no-header";                    # one shared, low bucket for requests the tunnel did not stamp
}
limit_req_zone $support_key zone=support:1m rate=6r/m;
limit_req_status 429;

# 2) inside the existing server { } block:
location = /support/upload {
    limit_except POST { deny all; }
    # refuse before reading the body: no bearer, no spooling (the receiver checks the token itself)
    if ($http_authorization !~ "^Bearer[ ][A-Za-z0-9+/=_-]{16,200}$") { return 401; }
    if ($http_cf_connecting_ip = "") { return 400; }
    limit_req zone=support burst=3 nodelay;
    client_max_body_size 21m;
    client_body_buffer_size 16k;            # small: nothing large is held in memory or on disk by nginx
    client_body_timeout 60s;
    proxy_request_buffering off;            # stream to the receiver, which authenticates before it reads the body
    proxy_http_version 1.1;
    proxy_pass http://didle-support-recv:8899;   # the client Authorization header passes through unchanged
    proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
    proxy_set_header X-Forwarded-For "";
    access_log off;                         # no friend addresses in nginx logs for this path
}
location = /support/health {
    proxy_pass http://didle-support-recv:8899;
    access_log off;
}
# Nothing under /support/ is ever served statically; the inbox is not under www/.
