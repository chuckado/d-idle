# Automatic PR review: one advisory summary comment from the Anthropic Messages API (tools/ci/pr_review.py, stdlib only).
# Runs ONLY for PRs from a branch of this repo opened by the owner, so strangers and forks never spend the credit.
# Needs the repository secret ANTHROPIC_API_KEY (set by the owner, see docs/process/api-credits.md). Never blocks a merge.
name: pr-review
on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.actor == github.repository_owner && !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 tools/ci/pr_review.py
