<title>d.idle Watch Cockpit</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: a cockpit that fills the viewport and never scrolls. Band on top; the game picture sized by the viewport height;
   under it one strip (progress, journey, health); the rest of the width is the command rail (needs you, orders, map). */
:root{
  color-scheme:dark;
  --bg:#0b0907;--s1:#17130f;--s2:#201a14;--s3:#2a231b;--line:#342b21;--line2:#4a3f31;
  --text:#ece2cf;--text2:#b9aa94;--text3:#857560;
  --accent:#c7a44a;--accent-text:#e6c76f;--on-accent:#1a1408;--focus:#8db8ff;
  --ok:#7cc47e;--warn:#e3a93a;--danger:#ec7d6c;--info:#7ab0e8;
  --ok-bg:#1c2819;--warn-bg:#33270e;--danger-bg:#371a14;--info-bg:#15222f;
  --life:#c8433a;--mana:#4f7fe0;--hatch:#120f0c;
  --display:Georgia,"Iowan Old Style","Palatino Linotype",serif;
  --body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --num:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --g:8px;--band:44px;--strip:112px;--rail-min:400px;
  --vh:min(calc(100dvh - var(--band) - var(--strip) - 3 * var(--g)), calc((100vw - var(--rail-min) - 3 * var(--g)) * .75));
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  color-scheme:light;--bg:#e9e1d1;--s1:#f8f2e6;--s2:#efe6d4;--s3:#e3d8c1;--line:#d6c9ad;--line2:#b9a988;
  --text:#231c12;--text2:#55493a;--text3:#7a6c58;--accent:#8a6a14;--accent-text:#6f540c;--on-accent:#fff8e6;--focus:#1f5fbf;
  --ok:#2c7a34;--warn:#8f5f00;--danger:#b23a2a;--info:#1f5f9f;--ok-bg:#dcecd6;--warn-bg:#f3e3bb;--danger-bg:#f5d9d2;--info-bg:#d7e5f3;
  --life:#b8362c;--mana:#3564c4;--hatch:#ddd3bd;
}}
:root[data-theme="light"]{
  color-scheme:light;--bg:#e9e1d1;--s1:#f8f2e6;--s2:#efe6d4;--s3:#e3d8c1;--line:#d6c9ad;--line2:#b9a988;
  --text:#231c12;--text2:#55493a;--text3:#7a6c58;--accent:#8a6a14;--accent-text:#6f540c;--on-accent:#fff8e6;--focus:#1f5fbf;
  --ok:#2c7a34;--warn:#8f5f00;--danger:#b23a2a;--info:#1f5f9f;--ok-bg:#dcecd6;--warn-bg:#f3e3bb;--danger-bg:#f5d9d2;--info-bg:#d7e5f3;
  --life:#b8362c;--mana:#3564c4;--hatch:#ddd3bd;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:12.5px/1.35 var(--body);overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
.num{font-family:var(--num);font-variant-numeric:tabular-nums}
.app{height:100dvh;display:grid;grid-template-rows:var(--band) minmax(0,1fr)}

/* band */
.band{display:flex;align-items:center;gap:14px;background:var(--s1);border-bottom:1px solid var(--line);min-width:0;
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.brand{font:700 16px var(--display);color:var(--accent-text);display:flex;align-items:center;gap:6px;flex:none}
.brand i{width:9px;height:9px;background:var(--accent);transform:rotate(45deg)}
.say{flex:1 1 auto;min-width:0;display:flex;align-items:center;gap:9px;background:none;border:0;padding:0;text-align:left;height:100%}
.word{flex:none;font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;padding:3px 8px;border-radius:3px;background:var(--ok-bg);color:var(--ok)}
.say[data-tone="warn"] .word{background:var(--warn-bg);color:var(--warn)}.say[data-tone="info"] .word{background:var(--info-bg);color:var(--info)}
.txt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:15px;font-weight:600}
.txt span{font-weight:400;color:var(--text2)}
.vl{color:var(--text3);font-size:10px}
.vit{flex:none;display:grid;grid-template-columns:auto 86px 30px;gap:3px 6px;align-items:center;font-size:10.5px}
.bar{height:5px;border-radius:3px;background:var(--s3);overflow:hidden}.bar i{display:block;height:100%}
.pill{flex:none;border:0;border-radius:999px;padding:4px 11px;font-weight:700;font-size:11px;background:var(--danger-bg);color:var(--danger)}
.pill[data-n="0"]{background:var(--s2);color:var(--text3)}
.nav{flex:none;display:flex;gap:4px}
.nav button{background:none;border:1px solid var(--line2);border-radius:4px;padding:4px 10px;color:var(--text2)}

/* stage */
.stage{min-height:0;display:grid;gap:var(--g);padding-block:var(--g);
  padding-left:max(var(--g),env(safe-area-inset-left,0px));padding-right:max(var(--g),env(safe-area-inset-right,0px));
  grid-template-columns:calc(var(--vh) * 4 / 3) minmax(0,1fr);grid-template-rows:var(--vh) minmax(0,1fr);
  grid-template-areas:"video rail" "strip rail"}
.video{grid-area:video;position:relative;background:repeating-linear-gradient(135deg,var(--hatch) 0 16px,var(--bg) 16px 32px);border:1px solid var(--line2);border-radius:4px;display:grid;place-items:center;color:var(--text3);text-align:center;min-width:0;overflow:hidden}
.video .where{position:absolute;left:8px;bottom:8px;background:rgb(0 0 0 / .62);color:#ece2cf;padding:3px 8px;border-radius:3px;font-size:11px}
.video .mm{position:absolute;right:8px;top:8px;display:flex;gap:4px}
.video .mm button{background:rgb(0 0 0 / .62);border:1px solid rgb(255 255 255 / .18);color:#ece2cf;border-radius:3px;padding:2px 8px;font-size:11px}
.strip{container-type:inline-size;grid-area:strip;min-height:0;display:grid;gap:var(--g);grid-template-columns:minmax(0,1fr) minmax(0,1.25fr) minmax(0,1.1fr)}
.rail{grid-area:rail;min-height:0;min-width:0;display:grid;gap:var(--g);grid-template-rows:auto auto minmax(0,1fr);grid-template-columns:minmax(0,1fr)}
.tile{background:var(--s1);border-radius:4px;padding:8px 10px;min-width:0;min-height:0;overflow:hidden;display:flex;flex-direction:column}
.tile>h2{flex:none;margin:0 0 6px;font:700 10px var(--body);letter-spacing:.11em;text-transform:uppercase;color:var(--text3);display:flex;justify-content:space-between;align-items:center;gap:8px}
.tile>h2 em{font-style:normal;font-weight:400;letter-spacing:0;text-transform:none;color:var(--text2);font-size:11px}
.needs:empty{display:none}

/* rows */
.row{display:grid;grid-template-columns:16px minmax(0,auto) minmax(0,1fr) auto auto;gap:8px;align-items:center;min-height:28px;border-top:1px solid var(--line);padding:2px 0}
.row:first-of-type{border-top:0}
.row .ix{font:10.5px var(--num);color:var(--text3);text-align:center}
.row .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .r{color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11.5px}
.row.plan .t{font-weight:400;color:var(--text2)}
.row[data-s="done"] .t{color:var(--text3);font-weight:400}
.chip{font-size:10px;padding:1px 7px;border-radius:999px;background:var(--s3);color:var(--text2);white-space:nowrap;text-transform:uppercase;letter-spacing:.05em}
.chip[data-s="active"]{background:var(--ok-bg);color:var(--ok)}.chip[data-s="waiting"],.chip[data-s="next"]{background:var(--info-bg);color:var(--info)}.chip[data-s="failed"]{background:var(--danger-bg);color:var(--danger)}
.x{background:none;border:0;color:var(--text3);padding:0 4px;font-size:15px;line-height:1}
.x:hover{color:var(--danger)}
.alert{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:8px;align-items:center;min-height:32px;padding:3px 8px;border-radius:3px;background:var(--info-bg)}
.alert+.alert{margin-top:4px}
.alert[data-sev="danger"]{background:var(--danger-bg)}.alert[data-sev="warn"]{background:var(--warn-bg)}
.alert p{margin:0;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.alert p b{font-weight:600}.alert p span{color:var(--text2)}
.shape{width:10px;height:10px;background:var(--info);border-radius:50%}
[data-sev="warn"] .shape{background:var(--warn);border-radius:0;clip-path:polygon(50% 0,100% 100%,0 100%)}
[data-sev="danger"] .shape{background:var(--danger);border-radius:0;clip-path:polygon(30% 0,70% 0,100% 30%,100% 70%,70% 100%,30% 100%,0 70%,0 30%)}
.btn{height:26px;padding:0 10px;border-radius:3px;border:1px solid var(--line2);background:var(--s2);white-space:nowrap}
.btn:hover{background:var(--s3)}
.btn.p{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.btn kbd{font:10px var(--num);opacity:.6;margin-left:5px}
.verbs{flex:none;display:flex;gap:4px;margin-bottom:4px;position:relative}
.verbs .btn{flex:1 1 0;padding:0 4px}
.rows{min-height:0;overflow:auto}
.more{position:absolute;right:0;top:30px;z-index:5;background:var(--s2);border:1px solid var(--line2);border-radius:4px;padding:4px;display:grid;min-width:190px;box-shadow:0 8px 24px rgb(0 0 0 / .4)}
.more button{background:none;border:0;text-align:left;padding:5px 8px;border-radius:3px}.more button:hover{background:var(--s3)}

/* map */
.maptile{position:relative}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:3px;overflow:hidden}
.seg button{background:none;border:0;padding:1px 8px;font-size:10.5px;color:var(--text2);letter-spacing:0;text-transform:none;font-weight:400}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.act{container-type:size;position:relative;flex:1 1 auto;min-height:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(10,minmax(0,1fr));gap:clamp(2px,.6cqh,5px) 14px}
.act svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.act line{stroke:var(--line2);stroke-width:1.5;vector-effect:non-scaling-stroke}.act line.dun{stroke-dasharray:3 4}
.act polyline{fill:none;stroke:var(--accent);stroke-width:2.5;vector-effect:non-scaling-stroke}
.node{position:relative;z-index:1;background:var(--s2);border:1px solid var(--line2);border-left:3px solid var(--text3);border-radius:3px;padding:0 6px;text-align:left;display:flex;align-items:center;justify-content:space-between;gap:4px;min-width:0;font-size:11px;white-space:nowrap;overflow:hidden}
.node:hover{background:var(--s3)}
.node>span:first-child{overflow:hidden;text-overflow:ellipsis;min-width:0;line-height:1.25}
.node em{display:none;font-style:normal;color:var(--text3);font-size:10px;overflow:hidden;text-overflow:ellipsis}
@container (min-height:430px){.node em{display:block}}
@container (max-height:300px){.node{font-size:10.5px;padding:0 5px}}
.node small{color:var(--text3);font:9.5px var(--num);flex:none}
.node[data-b="in"]{border-left-color:var(--ok)}.node[data-b="above"]{border-left-color:var(--warn)}.node[data-b="hard"]{border-left-color:var(--danger)}
.node[data-b="locked"]{border-style:dashed;color:var(--text3)}
.node[data-here]{box-shadow:0 0 0 1.5px var(--info)}
.node[data-target]{box-shadow:0 0 0 2px var(--accent);background:var(--s3)}
.node .pin{background:var(--accent);color:var(--on-accent);border-radius:50%;width:14px;height:14px;display:grid;place-items:center;font:700 9px var(--num);flex:none}
.legend{grid-column:1;grid-row:1 / span 3;display:flex;flex-direction:column;justify-content:flex-start;gap:3px;font-size:10.5px;color:var(--text3);min-width:0}
.legend span{display:flex;align-items:center;gap:6px;white-space:nowrap}
.legend span::before{content:"";width:3px;height:12px;background:var(--text3);flex:none}
.legend span[data-b="in"]::before{background:var(--ok)}.legend span[data-b="above"]::before{background:var(--warn)}.legend span[data-b="hard"]::before{background:var(--danger)}
.acts{grid-column:3;grid-row:1 / span 3;display:flex;gap:3px;align-items:flex-start;justify-content:flex-end}
.acts button{width:26px;height:22px;background:none;border:1px solid var(--line2);border-radius:3px;font:11px var(--display);color:var(--text2);padding:0}
.acts button[aria-pressed="true"]{background:var(--s3);color:var(--accent-text);border-color:var(--accent)}.acts button[disabled]{color:var(--text3);border-style:dashed;cursor:default}
.area{flex:1 1 auto;min-height:0}
.area svg{width:100%;height:100%;display:block}
.area rect{fill:var(--s3);stroke:var(--line2)}.area .tr{fill:none;stroke:var(--info);stroke-width:2}.area .ft{fill:none;stroke:var(--danger);stroke-width:2}
.orders,.areatile{position:relative}
.orders{overflow:visible}
.menu{position:absolute;left:0;right:0;bottom:0;z-index:6;min-height:100%;background:var(--s2);border:1px solid var(--line2);border-radius:4px;padding:10px;box-shadow:0 10px 28px rgb(0 0 0 / .5)}
.menu h3{margin:0;font:700 13.5px var(--body);display:flex;justify-content:space-between}
.menu p{margin:3px 0 0;color:var(--text2);font-size:11.5px}.menu p.w{color:var(--warn)}
.menu .d{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.menu .d .btn[aria-pressed="true"]{background:var(--s3);border-color:var(--accent);color:var(--accent-text)}

/* strip */
.pg{flex:1;display:flex;flex-direction:column;justify-content:center;gap:6px;min-height:0}
.pg .m{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center}
.pg .m .meter{margin:0}
.pg .v{display:flex;gap:14px;align-items:baseline;justify-content:space-between}
.pg .v span{white-space:nowrap}
.pg label{display:block;font-size:10.5px;color:var(--text2)}
.pg strong{font:600 17px var(--num);font-variant-numeric:tabular-nums}
.meter{height:7px;border-radius:4px;background:var(--s3);overflow:hidden;margin:5px 0 3px}.meter i{display:block;height:100%;background:var(--accent)}
.sub{font-size:11px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spark polyline{fill:none;stroke:var(--text2);stroke-width:1.5}.spark circle{fill:var(--accent)}
.tile.s{justify-content:flex-start}
.jbody{flex:1;display:flex;flex-direction:column;justify-content:center;min-height:0}
.path{display:flex;align-items:center;gap:0;margin:0 0 8px}
.path i{flex:1;height:2px;background:var(--line2)}.path i.d{background:var(--ok)}
.path b{flex:none;width:17px;height:17px;border-radius:50%;display:grid;place-items:center;font:700 9.5px var(--num);background:var(--s3);color:var(--text3)}
.path b.d{background:var(--ok-bg);color:var(--ok)}.path b.c{background:var(--accent);color:var(--on-accent);width:21px;height:21px}
.jr{display:flex;align-items:center;gap:8px;min-width:0}.jr .sub{flex:1}
.lights{flex:1;align-content:center;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2px;align-items:center}
.light{background:none;border:0;padding:2px;text-align:center;min-width:0;border-radius:3px}
.light:hover{background:var(--s2)}
.light i{display:block;width:9px;height:9px;border-radius:50%;margin:0 auto 5px;background:var(--ok)}
.light[data-l="warn"] i{background:var(--warn)}.light[data-l="danger"] i{background:var(--danger)}
.light b{display:block;font-size:10.5px;font-weight:600}.light span{display:block;font-size:10.5px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.pop{position:fixed;z-index:9;top:calc(var(--band) + 4px);left:120px;max-width:560px;background:var(--s2);border:1px solid var(--line2);border-radius:4px;padding:10px 12px;box-shadow:0 10px 28px rgb(0 0 0 / .5);display:grid;grid-template-columns:max-content 1fr;gap:4px 12px}
.pop dt{color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.08em;padding-top:2px}.pop dd{margin:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:9;background:var(--s3);border:1px solid var(--line2);border-radius:4px;padding:6px 10px;display:flex;gap:10px;align-items:center;box-shadow:0 8px 24px rgb(0 0 0 / .45)}
.demo{position:relative;flex:none;font-size:10.5px;color:var(--text3)}
.demo div{position:absolute;right:0;top:24px;z-index:12;width:170px}
.demo summary{cursor:pointer;list-style:none;background:var(--s2);border:1px dashed var(--line2);border-radius:3px;padding:2px 7px;display:inline-block}
.demo div{background:var(--s2);border:1px dashed var(--line2);border-radius:4px;padding:6px;margin-top:4px;display:grid;gap:4px}
.demo button{background:none;border:1px solid var(--line2);border-radius:3px;padding:2px 6px;color:var(--text2);text-align:left}
.demo button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent-text)}
.tabs{display:none}

/* wide: the rail has room for both maps side by side */
@media (min-width:1700px){
  .rail{grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr);grid-template-areas:"needs needs" "orders orders" "act area"}
  .needs{grid-area:needs}.orders{grid-area:orders}.maptile{grid-area:act}.areatile{grid-area:area;display:flex!important}
  .maptile .seg{display:none}
}
.areatile{display:none}
.areatile .menu{bottom:auto;top:0;min-height:0}
.node[data-pick]{box-shadow:0 0 0 2px var(--focus)}
/* phone: band, picture, vitals strip, then one tab at a time; still no page scroll */
@media (max-width:700px){
  :root{--band:auto}
  .band{flex-wrap:wrap;gap:4px 10px;padding-block:6px}
  .say{flex-basis:100%;order:3;height:auto}.txt{font-size:13px;white-space:normal}
  .nav button:not(:last-child){display:none}
  .brand{flex:1}
  .app{grid-template-rows:auto minmax(0,1fr)}
  .stage{display:flex;flex-direction:column}
  .video{flex:none;aspect-ratio:4/3;width:100%}
  .tabs{display:flex;gap:4px;flex:none}
  .tabs button{flex:1;height:34px;background:var(--s1);border:1px solid var(--line);border-radius:4px;color:var(--text2)}
  .tabs button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-weight:600}
  .rail,.strip{display:contents}
  .tile{flex:1 1 0}
  .stage[data-tab="orders"] .tile:not(.needs):not(.orders),.stage[data-tab="map"] .tile:not(.maptile),.stage[data-tab="hero"] .tile:not(.s){display:none}
  .needs{flex:0 0 auto}
  .btn,.verbs .btn{height:38px}.row{min-height:38px}.verbs kbd{display:none}
  .demo{display:none}
}
@media (max-width:1400px) and (min-width:701px){.jr .btn+.btn{display:none}.spark{display:none}}
@media (max-height:760px) and (min-width:701px){:root{--strip:92px}.tile{padding:6px 9px}.tile>h2{margin-bottom:4px}.alert{min-height:28px}.row{min-height:25px}}
@container (max-width:700px){.light span{display:none}.light i{margin-bottom:4px}.jr .btn+.btn{display:none}.pg .v label{display:none}.spark{display:none}.pg .v{justify-content:flex-start}}
@media (prefers-reduced-motion:no-preference){.meter i,.bar i{transition:width .24s}}
</style>

<div class="app">
<header class="band">
  <div class="brand"><i></i>d.idle</div>
  <button class="say" id="say" aria-expanded="false" aria-live="polite"></button>
  <div class="vit" aria-label="Life and mana"><span class="vl">life</span><span class="bar"><i style="width:72%;background:var(--life)"></i></span><span class="num">86</span><span class="vl">mana</span><span class="bar"><i style="width:75%;background:var(--mana)"></i></span><span class="num">105</span></div>
  <button class="pill" id="pill"></button>
  <nav class="nav"><button>Character</button><button>Skills</button><button aria-label="More: layout, theme, help">...</button></nav>
  <details class="demo"><summary>demo</summary><div id="demo"></div></details>
</header>
<main class="stage" id="stage" data-tab="orders">
  <section class="video" aria-label="Game"><div>Game picture<br><small>live, 4:3, about 20 frames a second</small></div>
    <span class="where">Cold Plains, explored 64%</span><span class="mm"><button>Full screen</button></span></section>
  <div class="tabs" id="tabs"></div>
  <div class="strip">
    <section class="tile s"><h2>Progress <em>level 7</em></h2>
      <div class="pg"><div class="m"><span class="sub">to 10</span><div class="meter"><i style="width:62%"></i></div><span class="sub">62% · 25 min</span></div>
